name: Release

# Publishes a GitHub release with the installable plugin ZIP and an updatePlugins.xml, so the plugin can be
# installed with "Install Plugin from Disk…" or from a custom plugin repository that keeps it updated.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading "v" (e.g. 0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build plugin
        run: ./gradlew :core:test buildPlugin -PpluginVersion=${{ steps.version.outputs.version }}

      - name: Write plugin repository descriptor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          since_build=$(grep -E '^pluginSinceBuild' gradle.properties | cut -d= -f2 | tr -d ' ')
          zip="intellij-http-gui-${VERSION}.zip"
          test -f "build/distributions/$zip"
          cat > build/distributions/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.jcake.httpgui"
                    url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${zip}"
                    version="${VERSION}">
              <idea-version since-build="${since_build}"/>
              <name>HTTP Request Designer</name>
              <vendor>J-Cake</vendor>
              <description>Graphical editor for IntelliJ HTTP Client files.</description>
            </plugin>
          </plugins>
          XML

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### Installing

            **From disk:** download `intellij-http-gui-${{ steps.version.outputs.version }}.zip` below, then in the IDE open
            *Settings → Plugins → ⚙ → Install Plugin from Disk…* and pick the ZIP (don't unpack it).

            **With updates:** add this URL under *Settings → Plugins → ⚙ → Manage Plugin Repositories…*, then search
            for "HTTP Request Designer" in the Marketplace tab:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/updatePlugins.xml
            ```
          files: |
            build/distributions/intellij-http-gui-${{ steps.version.outputs.version }}.zip
            build/distributions/updatePlugins.xml
